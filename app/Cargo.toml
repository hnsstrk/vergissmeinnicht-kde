[package]
name = "vergissmeinnicht-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vergissmeinnicht"
path = "src/main.rs"

[dependencies]
vergissmeinnicht-core = { path = "../core" }
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Gleiche rusqlite-Version wie taskchampion — zwei libsqlite3-sys-Versionen
# können nicht koexistieren (native `links`-Grenze).
rusqlite = "0.39"
keyring = { version = "3", features = ["sync-secret-service"] }
# Nur für `kill(2)`: Die Diktat-Aufnahme wird über SIGINT/SIGTERM beendet
# (ai/transcribe.rs) — `Child::kill` kann ausschließlich SIGKILL.
libc = "0.2"
notify-rust = "4"
uuid.workspace = true
# Blockierender HTTP-Client für den KI-Endpunkt (ai/client.rs). rustls statt
# native-tls, damit neben dem von taskchampion aufgelösten reqwest/rustls kein
# zweiter TLS-Stack (openssl-sys) in den Baum kommt; kein direktes tokio.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build.workspace = true

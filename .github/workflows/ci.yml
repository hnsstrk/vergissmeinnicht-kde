name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Arch container: same Qt/KF6 versions as the target platform (rolling
    # release, current Kirigami). Ubuntu LTS packages are too old for Kirigami 6.
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm \
            base-devel git rust clang \
            qt6-base qt6-declarative \
            kirigami kirigami-addons ki18n kiconthemes \
            qqc2-desktop-style breeze-icons \
            gettext

      - uses: actions/checkout@v5

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        # The Arch rust package already ships clippy. --all-targets also lints
        # test and example code (#36) — without it, violations in test code reach
        # the review instead of the CI.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate translations
        run: |
          for po in po/*.po; do msgfmt --check -o /dev/null "$po"; done

      - name: Validate desktop file
        run: |
          pacman -S --noconfirm desktop-file-utils appstream
          desktop-file-validate data/de.hnsstrk.vergissmeinnicht.desktop
          appstreamcli validate --no-net data/de.hnsstrk.vergissmeinnicht.metainfo.xml

      - name: Flow test (i18n argument check, AI via mock)
        # ki18n reports missing %1 arguments only at runtime — the flow test makes
        # them visible in the log (I18N_ARGUMENT_MISSING / "instead of").
        # The AI part (sections from 8 onwards) runs only with a configured model:
        # throwaway config.json plus VMN_AI_MOCK canned data, otherwise the flow
        # ends after the scaffolding section (#36). The part with a real recording
        # still skips itself in the container via FLOW-INFO (no pw-record
        # installed); the dictation-to-draft flow (AI-B2, #14) does run — VMN_STT_MOCK
        # supplies the canned transcript without a microphone and without Whisper.
        #
        # The grep patterns below match German program output verbatim
        # (app/qml/Main.qml) — they are mechanics, not display. Translating them
        # would make the comparison find nothing. VMN_STT_MOCK is different: the
        # flow only compares it against itself, so the wording is free — it stays
        # German because the source language is, and because docs/building.md
        # quotes the same value.
        run: |
          export XDG_DATA_HOME=/tmp/vmn-flow XDG_CONFIG_HOME=/tmp/vmn-flow-cfg
          export QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1
          export VMN_AI_MOCK="$PWD/app/src/ai/fixtures/flow-konserven.json"
          export VMN_STT_MOCK="Zahnarzttermin für nächste Woche ausmachen"
          mkdir -p "$XDG_CONFIG_HOME/vergissmeinnicht"
          printf '{"ai_model": "vmn-mock", "ai_base_url": "http://localhost:11434/v1"}' \
            > "$XDG_CONFIG_HOME/vergissmeinnicht/config.json"
          timeout 120 ./target/debug/vergissmeinnicht --test-flow > /tmp/flow.log 2>&1 || true
          grep -q "FLOW-ENDE: alles grün" /tmp/flow.log || { cat /tmp/flow.log; exit 1; }
          if grep -q "FLOW-INFO KI-Worker-Teil übersprungen" /tmp/flow.log; then
            echo "::error::AI part of the flow did not run (mock configuration does not take effect)"; exit 1
          fi
          if grep -q "FLOW-INFO Diktat-Fluss übersprungen" /tmp/flow.log; then
            echo "::error::Dictation flow did not run (VMN_STT_MOCK does not take effect)"; exit 1
          fi
          echo "Flow checks: $(grep -c 'FLOW-OK' /tmp/flow.log || true)"
          if grep -E "I18N_ARGUMENT_MISSING|kf.i18n:.*instead of" /tmp/flow.log; then
            echo "::error::i18n argument error in the flow log"; exit 1
          fi

      - name: Interaction test (synthetic events)
        # "INPUT-ENDE: alles grün" is German program output (app/qml/TasksPage.qml)
        # — mechanics, not display. Do not translate without changing the source.
        run: |
          export XDG_DATA_HOME=/tmp/vmn-input XDG_CONFIG_HOME=/tmp/vmn-input-cfg
          export QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1
          cargo run -q -p vergissmeinnicht-core --example seed_demo -- /tmp/vmn-input/vergissmeinnicht/replica
          timeout 120 ./target/debug/vergissmeinnicht --test-input > /tmp/input.log 2>&1 || true
          grep -q "INPUT-ENDE: alles grün" /tmp/input.log || { cat /tmp/input.log; exit 1; }
